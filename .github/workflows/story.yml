name: Сториз в Telegram-канал

on:
  # Запуск из Google-таблицы (Stories.gs), когда пост с галочкой «TG сториз» вышел в канал.
  repository_dispatch:
    types: [tg-story]
  # Ручной запуск для проверки: Actions → этот workflow → Run workflow → номер поста.
  workflow_dispatch:
    inputs:
      message_id:
        description: 'Номер поста в канале (из ссылки t.me/producer_chmonya/НОМЕР)'
        required: true

concurrency:
  group: tg-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'telethon>=1.40,<2'
      - run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python story.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id || inputs.message_id }}
